<svg xmlns="http://www.w3.org/2000/svg" viewBox="12 6.25 72 72" fill="none">
  <defs>
    <linearGradient id="drinks-ceramic" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0d3" />
      <stop offset="1" stop-color="#d6b98a" />
    </linearGradient>
    <linearGradient id="drinks-cream" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4dc" />
      <stop offset="1" stop-color="#efd29b" />
    </linearGradient>
    <linearGradient id="drinks-red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#df8b69" />
      <stop offset="1" stop-color="#be513b" />
    </linearGradient>
    <linearGradient id="drinks-ochre" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecc074" />
      <stop offset="1" stop-color="#c48b45" />
    </linearGradient>
    <linearGradient id="drinks-sage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b1c97e" />
      <stop offset="1" stop-color="#6d9448" />
    </linearGradient>
    <linearGradient id="drinks-plum" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bf8db3" />
      <stop offset="1" stop-color="#8c5d8d" />
    </linearGradient>
    <linearGradient id="drinks-fish" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bdd0b5" />
      <stop offset="1" stop-color="#6f997d" />
    </linearGradient>
    <filter id="drinks-wash" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" seed="12" result="paper" />
      <feColorMatrix in="paper" type="saturate" values="0" result="grain" />
      <feComponentTransfer in="grain" result="pigment">
        <feFuncA type="linear" slope=".06" />
      </feComponentTransfer>
      <feComposite in="pigment" in2="SourceGraphic" operator="in" result="clipped" />
      <feBlend in="SourceGraphic" in2="clipped" mode="multiply" />
    </filter>
    <filter id="drinks-ink" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency=".055" numOctaves="2" seed="7" result="hand" />
      <feDisplacementMap in="SourceGraphic" in2="hand" scale=".15" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <linearGradient id="drinks-ciderLiquid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0" stop-color="#f5c76c" />
      <stop offset="1" stop-color="#ce8d3e" />
    </linearGradient>
    <linearGradient id="drinks-matchaCup" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0" stop-color="#95bc75" />
      <stop offset="1" stop-color="#638b4d" />
    </linearGradient>
  </defs>
  <g id="drinks-artwork">
    <ellipse cx="48" cy="67" rx="32" ry="5.5" fill="#493326" fill-opacity="0.15" />
    <circle cx="27" cy="24" r="10" fill="#e7983d" stroke="#493326" stroke-width="2.05" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="27" cy="24" r="7.5" fill="#f3dd9b" stroke="#493326" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M24 12L36 32" stroke="#493326" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="24" y="20" width="32" height="43" rx="7" fill="#fff2d6" fill-opacity="0.72" stroke="#493326" stroke-width="2.05" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="26.5" y="27" width="27" height="33.5" rx="5" fill="url(#drinks-ciderLiquid)" stroke="#493326" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="30" y="31" width="7" height="7" rx="2" fill="#FFF7D6" fill-opacity="0.55" stroke="#493326" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="41" y="34" width="6.5" height="6.5" rx="2" fill="#FFF7D6" fill-opacity="0.45" stroke="#493326" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M46 21C46 15 52 11 58 14C58 20 52 23 46 21Z" fill="#829c51" stroke="#493326" stroke-width="2.05" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M52 44H80C80 56 74 63 66 63C58 63 52 56 52 44Z" fill="url(#drinks-matchaCup)" stroke="#493326" stroke-width="2.05" stroke-linejoin="round" stroke-linecap="round" />
    <ellipse cx="66" cy="44" rx="14" ry="4" fill="#a4da7f" stroke="#493326" stroke-width="2.05" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
