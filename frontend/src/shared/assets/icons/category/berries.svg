<svg xmlns="http://www.w3.org/2000/svg" viewBox="19.5 14 85 85" fill="none">
  <defs>
    <linearGradient id="berries-ceramic" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0d3" />
      <stop offset="1" stop-color="#d6b98a" />
    </linearGradient>
    <linearGradient id="berries-cream" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4dc" />
      <stop offset="1" stop-color="#efd29b" />
    </linearGradient>
    <linearGradient id="berries-red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#df8b69" />
      <stop offset="1" stop-color="#be513b" />
    </linearGradient>
    <linearGradient id="berries-ochre" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecc074" />
      <stop offset="1" stop-color="#c48b45" />
    </linearGradient>
    <linearGradient id="berries-sage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b1c97e" />
      <stop offset="1" stop-color="#6d9448" />
    </linearGradient>
    <linearGradient id="berries-plum" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bf8db3" />
      <stop offset="1" stop-color="#8c5d8d" />
    </linearGradient>
    <linearGradient id="berries-fish" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bdd0b5" />
      <stop offset="1" stop-color="#6f997d" />
    </linearGradient>
    <filter id="berries-wash" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" seed="18" result="paper" />
      <feColorMatrix in="paper" type="saturate" values="0" result="grain" />
      <feComponentTransfer in="grain" result="pigment">
        <feFuncA type="linear" slope=".06" />
      </feComponentTransfer>
      <feComposite in="pigment" in2="SourceGraphic" operator="in" result="clipped" />
      <feBlend in="SourceGraphic" in2="clipped" mode="multiply" />
    </filter>
    <filter id="berries-ink" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency=".055" numOctaves="2" seed="7" result="hand" />
      <feDisplacementMap in="SourceGraphic" in2="hand" scale=".15" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
  <g id="berries-artwork">
    <g filter="url(#berries-ink)">
      <g stroke="#563d2a" stroke-width="1.05" stroke-linecap="round" stroke-linejoin="round" filter="url(#berries-wash)">
        <ellipse cx="62" cy="91" rx="37" ry="4" fill="#836d51" opacity=".12" stroke="none" />
        <path d="M31 56q-1 26 29 31 26 3 39-27z" fill="url(#berries-ceramic)" stroke-width="2.05" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M29 56q35-15 70 0-28 17-70 0z" fill="#eddbba" stroke-width="2.05" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M43 54q-18-15-7-25 10-10 20 1 12-7 17 7 5 15-13 28z" fill="url(#berries-red)" stroke-width="2.05" stroke-linecap="round" stroke-linejoin="round" />
        <path d="m39 30 2-12 8 8 7-8 1 12" fill="#829c51" stroke-width="2.05" stroke-linecap="round" stroke-linejoin="round" />
        <path d="m42 40 1 2m10-5 1 2m-6 9 1 2m12-7 1 2m-3 10 1 2" stroke="#efdab1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
        <circle cx="81" cy="45" r="9" fill="#72638d" stroke-width="2.05" stroke-linecap="round" stroke-linejoin="round" />
        <circle cx="88" cy="57" r="8" fill="#5d4c7d" stroke-width="2.05" stroke-linecap="round" stroke-linejoin="round" />
        <circle cx="75" cy="59" r="7" fill="#9282b0" stroke-width="2.05" stroke-linecap="round" stroke-linejoin="round" />
        <path d="m79 42 3 2m4 11 3 1m-15 1 2 2" stroke="#c9bbc1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M38 71q23 12 48 2" fill="none" stroke="#b55e44" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      </g>
    </g>
  </g>
</svg>
