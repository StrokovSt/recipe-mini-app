    </linearGradient>
    <filter id="desserts-wash" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" seed="5" result="paper" />
      <feColorMatrix in="paper" type="saturate" values="0" result="grain" />
      <feComponentTransfer in="grain" result="pigment">
        <feFuncA type="linear" slope=".06" />
      </feComponentTransfer>
      <feComposite in="pigment" in2="SourceGraphic" operator="in" result="clipped" />
      <feBlend in="SourceGraphic" in2="clipped" mode="multiply" />
    </filter>
    <filter id="desserts-ink" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency=".055" numOctaves="2" seed="7" result="hand" />
      <feDisplacementMap in="SourceGraphic" in2="hand" scale=".15" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <linearGradient id="desserts-berryRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0" stop-color="#ec7d6f" />
      <stop offset="1" stop-color="#bc3f49" />
    </linearGradient>
    <linearGradient id="desserts-cakeFrost" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0" stop-color="#fff9ed" />
      <stop offset="1" stop-color="#f0d1c4" />
    </linearGradient>
