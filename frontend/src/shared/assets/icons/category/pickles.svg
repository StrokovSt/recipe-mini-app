    <circle cx="49" cy="48" r="5.5" fill="#fff2d6" stroke="#d1923d" stroke-width="2.05" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M44 33C49 32 54 36 53 42C48 42 44 38 44 33Z" fill="#829c51" stroke="#493326" stroke-width="2.05" stroke-linecap="round" stroke-linejoin="round" />
