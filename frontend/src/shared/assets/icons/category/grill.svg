    <path d="M14 23L84 17" stroke="#d09150" stroke-width="2.59" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="25" y="16" width="11" height="10" rx="3.5" transform="rotate(-5 25 16)" fill="url(#grill-skewerMeat)" stroke="#493326" stroke-width="2.05" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="39" y="15.5" width="8" height="9" rx="2.5" transform="rotate(-5 39 15.5)" fill="#829c51" stroke="#493326" stroke-width="2.05" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="50" y="14" width="11" height="10" rx="3.5" transform="rotate(-5 50 14)" fill="url(#grill-skewerMeat)" stroke="#493326" stroke-width="2.05" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="68" cy="18" r="5.5" fill="#7c4c2a" stroke="#493326" stroke-width="2.05" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M66 16L70 20M70 16L66 20" stroke="#fff2d6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
