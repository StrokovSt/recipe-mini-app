    <rect x="22" y="27" width="11.5" height="10.5" rx="3.5" transform="rotate(-5 22 27)" fill="url(#grill-skewerMeat)" stroke="#493326" stroke-width="2.05" stroke-linecap="round" stroke-linejoin="round" />
