<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 3 80 80" fill="none">
  <defs>
    <linearGradient id="grill-hibachiBody" x1="16" y1="42" x2="80" y2="66" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#514036" />
      <stop offset="1" stop-color="#261D18" />
    </linearGradient>
    <linearGradient id="grill-skewerMeat" x1="24" y1="18" x2="72" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e5653f" />
