    <rect x="48" y="25" width="11.5" height="10.5" rx="3.5" transform="rotate(-5 48 25)" fill="url(#grill-skewerMeat)" stroke="#493326" stroke-width="2.05" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="62.5" y="24.5" width="8.5" height="9.5" rx="2.5" transform="rotate(-5 62.5 24.5)" fill="#829c51" stroke="#493326" stroke-width="2.05" stroke-linecap="round" stroke-linejoin="round" />
