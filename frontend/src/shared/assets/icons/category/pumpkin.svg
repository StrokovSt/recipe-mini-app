<svg xmlns="http://www.w3.org/2000/svg" viewBox="17.54 8.33 93 93" fill="none">
  <defs>
    <linearGradient id="pumpkin-ceramic" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0d3" />
      <stop offset="1" stop-color="#d6b98a" />
    </linearGradient>
    <linearGradient id="pumpkin-cream" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4dc" />
      <stop offset="1" stop-color="#efd29b" />
    </linearGradient>
    <linearGradient id="pumpkin-red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#df8b69" />
      <stop offset="1" stop-color="#be513b" />
    </linearGradient>
    <linearGradient id="pumpkin-ochre" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecc074" />
      <stop offset="1" stop-color="#c48b45" />
    </linearGradient>
    <linearGradient id="pumpkin-sage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b1c97e" />
      <stop offset="1" stop-color="#6d9448" />
    </linearGradient>
    <linearGradient id="pumpkin-plum" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bf8db3" />
      <stop offset="1" stop-color="#8c5d8d" />
    </linearGradient>
    <linearGradient id="pumpkin-fish" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bdd0b5" />
      <stop offset="1" stop-color="#6f997d" />
    </linearGradient>
    <filter id="pumpkin-wash" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" seed="16" result="paper" />
      <feColorMatrix in="paper" type="saturate" values="0" result="grain" />
      <feComponentTransfer in="grain" result="pigment">
        <feFuncA type="linear" slope=".06" />
      </feComponentTransfer>
      <feComposite in="pigment" in2="SourceGraphic" operator="in" result="clipped" />
      <feBlend in="SourceGraphic" in2="clipped" mode="multiply" />
    </filter>
    <filter id="pumpkin-ink" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency=".055" numOctaves="2" seed="7" result="hand" />
      <feDisplacementMap in="SourceGraphic" in2="hand" scale=".15" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
  <g id="pumpkin-artwork">
    <g filter="url(#pumpkin-ink)">
      <g stroke="#563d2a" stroke-width="1.05" stroke-linecap="round" stroke-linejoin="round" filter="url(#pumpkin-wash)">
        <ellipse cx="64" cy="93" rx="38" ry="4" fill="#836d51" opacity=".12" stroke="none" />
        <path d="M28 45q10-13 23-9 12-8 24 0 18-2 25 15 9 24-12 35-21 15-47 1-22-6-13-42z" fill="url(#pumpkin-ochre)" stroke-width="2.05" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M52 37q-22 23-8 48M63 35q-6 26-2 55M76 38q17 21 7 47" fill="none" stroke="#ad733c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M58 36q4-12 2-20l9 3-2 18" fill="#8b8d66" stroke-width="2.05" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M67 22q11-14 24-7-4 14-23 12" fill="#9a9b73" stroke-width="2.05" stroke-linecap="round" stroke-linejoin="round" />
        <path d="m72 23 13-5" stroke="#d8d4b1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M32 58q-5 14 4 21M91 54q8 15-1 22" fill="none" stroke="#ebc890" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      </g>
    </g>
  </g>
</svg>
