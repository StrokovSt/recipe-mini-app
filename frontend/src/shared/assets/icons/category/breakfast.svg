    <ellipse cx="38" cy="43" rx="24" ry="8.5" fill="#f2cc94" stroke="#493326" stroke-width="2.05" stroke-linecap="round" stroke-linejoin="round" />
    <ellipse cx="38" cy="40" rx="24" ry="8" fill="#e58f2c" stroke="#493326" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" />
    <ellipse cx="38" cy="34" rx="24" ry="8.5" fill="#f5d5ad" stroke="#493326" stroke-width="2.05" stroke-linecap="round" stroke-linejoin="round" />
    <ellipse cx="38" cy="31" rx="23" ry="7.8" fill="url(#breakfast-pancakeTop)" stroke="#493326" stroke-width="2.05" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M30 28C30 24 35 22 39 22C44 22 48 25 47 29C46 33 45 38 43 38C41 38 41 33 38 33C35 33 30 32 30 28Z" fill="#FFFDF8" stroke="#493326" stroke-width="2.05" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="36" cy="24" r="3.2" fill="#bf4536" stroke="#493326" stroke-width="2.05" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="42" cy="25.5" r="3" fill="#493326" />
    <path d="M44 55C41 49 48 42 58 42C66 42 71 39 76 43C82 47 83 56 76 60C68 64 47 62 44 55Z" fill="#FFFDF9" stroke="#493326" stroke-width="2.05" stroke-linejoin="round" stroke-linecap="round" />
