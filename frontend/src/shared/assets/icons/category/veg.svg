<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 1.19 83 83" fill="none">
  <defs>
    <linearGradient id="veg-ceramic" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0d3" />
      <stop offset="1" stop-color="#d6b98a" />
    </linearGradient>
    <linearGradient id="veg-cream" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4dc" />
      <stop offset="1" stop-color="#efd29b" />
    </linearGradient>
    <linearGradient id="veg-red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#df8b69" />
      <stop offset="1" stop-color="#be513b" />
    </linearGradient>
    <linearGradient id="veg-ochre" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecc074" />
      <stop offset="1" stop-color="#c48b45" />
    </linearGradient>
    <linearGradient id="veg-sage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b1c97e" />
      <stop offset="1" stop-color="#6d9448" />
    </linearGradient>
    <linearGradient id="veg-plum" x1="0" y1="0" x2="1" y2="1">
