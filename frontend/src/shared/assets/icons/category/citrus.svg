<svg xmlns="http://www.w3.org/2000/svg" viewBox="19 7.31 95 95" fill="none">
  <defs>
    <linearGradient id="citrus-ceramic" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0d3" />
      <stop offset="1" stop-color="#d6b98a" />
    </linearGradient>
    <linearGradient id="citrus-cream" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4dc" />
      <stop offset="1" stop-color="#efd29b" />
    </linearGradient>
    <linearGradient id="citrus-red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#df8b69" />
      <stop offset="1" stop-color="#be513b" />
    </linearGradient>
    <linearGradient id="citrus-ochre" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecc074" />
      <stop offset="1" stop-color="#c48b45" />
    </linearGradient>
    <linearGradient id="citrus-sage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b1c97e" />
      <stop offset="1" stop-color="#6d9448" />
    </linearGradient>
    <linearGradient id="citrus-plum" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bf8db3" />
      <stop offset="1" stop-color="#8c5d8d" />
    </linearGradient>
    <linearGradient id="citrus-fish" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bdd0b5" />
      <stop offset="1" stop-color="#6f997d" />
    </linearGradient>
    <filter id="citrus-wash" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" seed="17" result="paper" />
      <feColorMatrix in="paper" type="saturate" values="0" result="grain" />
      <feComponentTransfer in="grain" result="pigment">
        <feFuncA type="linear" slope=".06" />
      </feComponentTransfer>
      <feComposite in="pigment" in2="SourceGraphic" operator="in" result="clipped" />
      <feBlend in="SourceGraphic" in2="clipped" mode="multiply" />
    </filter>
    <filter id="citrus-ink" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency=".055" numOctaves="2" seed="7" result="hand" />
      <feDisplacementMap in="SourceGraphic" in2="hand" scale=".15" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
  <g id="citrus-artwork">
    <g filter="url(#citrus-ink)">
      <g stroke="#563d2a" stroke-width="1.05" stroke-linecap="round" stroke-linejoin="round" filter="url(#citrus-wash)">
        <ellipse cx="64" cy="91" rx="38" ry="4" fill="#836d51" opacity=".12" stroke="none" />
        <path d="M23 56q2-23 27-25 25-1 30 25 4 24-22 30-28 5-35-16z" fill="url(#citrus-ochre)" stroke-width="2.05" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M48 32q-2-9 3-14M51 24q13-15 28-6-8 14-28 8" fill="#829c51" stroke-width="2.05" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M54 24q10-5 19-5" fill="none" stroke="#dcd6b0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M63 77q3-23 22-27 23 3 25 27-27 17-47 0z" fill="#cfa159" stroke-width="2.05" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M68 76q4-18 18-21 16 3 19 20-21 13-37 1z" fill="#f0d496" stroke-width="2.05" stroke-linecap="round" stroke-linejoin="round" />
        <path d="m86 59-2 22m1-4-13-5m13 4 14-8m-14 9 9 4" stroke="#f5e3b2" stroke-width="1.94" stroke-linecap="round" stroke-linejoin="round" />
        <path d="m34 51 1 1m5-7 1 1m-8 18 1 1m12 10 1 1m10-31 1 1" stroke="#a77942" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      </g>
    </g>
  </g>
</svg>
