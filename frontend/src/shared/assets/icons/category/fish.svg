<svg xmlns="http://www.w3.org/2000/svg" viewBox="10.69 5 78 78" fill="none">
  <defs>
    <linearGradient id="fish-ceramic" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0d3" />
      <stop offset="1" stop-color="#d6b98a" />
    </linearGradient>
    <linearGradient id="fish-cream" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4dc" />
      <stop offset="1" stop-color="#efd29b" />
    </linearGradient>
    <linearGradient id="fish-red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#df8b69" />
      <stop offset="1" stop-color="#be513b" />
    </linearGradient>
    <linearGradient id="fish-ochre" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecc074" />
      <stop offset="1" stop-color="#c48b45" />
    </linearGradient>
    <linearGradient id="fish-sage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b1c97e" />
      <stop offset="1" stop-color="#6d9448" />
    </linearGradient>
    <linearGradient id="fish-plum" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bf8db3" />
      <stop offset="1" stop-color="#8c5d8d" />
    </linearGradient>
    <linearGradient id="fish-fish" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bdd0b5" />
      <stop offset="1" stop-color="#6f997d" />
    </linearGradient>
    <filter id="fish-wash" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" seed="9" result="paper" />
      <feColorMatrix in="paper" type="saturate" values="0" result="grain" />
      <feComponentTransfer in="grain" result="pigment">
        <feFuncA type="linear" slope=".06" />
      </feComponentTransfer>
      <feComposite in="pigment" in2="SourceGraphic" operator="in" result="clipped" />
      <feBlend in="SourceGraphic" in2="clipped" mode="multiply" />
    </filter>
    <filter id="fish-ink" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency=".055" numOctaves="2" seed="7" result="hand" />
      <feDisplacementMap in="SourceGraphic" in2="hand" scale=".15" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <linearGradient id="fish-salmonFillet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0" stop-color="#f9ad84" />
      <stop offset="1" stop-color="#e97856" />
    </linearGradient>
    <linearGradient id="fish-salmonSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0" stop-color="#8aa7a0" />
      <stop offset="1" stop-color="#557d74" />
    </linearGradient>
  </defs>
  <g id="fish-artwork">
