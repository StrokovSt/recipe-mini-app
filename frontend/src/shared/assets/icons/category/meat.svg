    <path d="M25 28C18 33 19 42 28 46C38 50 56 51 67 45C76 40 76 31 67 25C57 19 33 21 25 28Z" fill="url(#meat-steakTop)" stroke="#493326" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="41" cy="35" r="7" fill="#F6E5D8" stroke="#493326" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="41" cy="35" r="3.5" fill="#d38266" stroke="#493326" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M49 35C55 33 61 29 65 25M46 41C53 41 60 39 67 35" stroke="#F6E5D8" stroke-width="2.59" stroke-linecap="round" stroke-opacity="0.8" stroke-linejoin="round" />
    <path d="M28 20L66 15" stroke="#493326" stroke-width="2.38" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M35 19L31 14M43 18L39 13M51 17L47 12M59 16L55 11M38 19L35 24M46 18L43 23M54 17L51 22" stroke="#829c51" stroke-width="2.38" stroke-linecap="round" stroke-linejoin="round" />
