    <path d="M39 27C42 32 43 39 42 45" stroke="#FFF3D1" stroke-width="3.24" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M51 30C53 34 54 40 53 45" stroke="#FFF3D1" stroke-width="2.81" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M44 56C42 46 50 38 63 38C76 38 84 46 82 56C80.5 62 74 63 69 58C66 55 60 55 57 58C52 63 45.5 62 44 56Z" fill="url(#baking-croissantGrad)" stroke="#493326" stroke-width="2.05" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M53 42C56 48 56 54 54 58M73 42C70 48 70 54 72 58M63 38V55" stroke="#FFF1C9" stroke-width="2.16" stroke-linecap="round" stroke-opacity="0.7" stroke-linejoin="round" />
