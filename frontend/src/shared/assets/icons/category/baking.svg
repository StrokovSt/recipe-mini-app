    <path d="M12 49C12 31 24 20 41 20C58 20 68 31 68 49C68 55 63 59 56 59H24C17 59 12 55 12 49Z" fill="url(#baking-breadCrust)" stroke="#493326" stroke-width="2.05" stroke-linejoin="round" stroke-linecap="round" />
