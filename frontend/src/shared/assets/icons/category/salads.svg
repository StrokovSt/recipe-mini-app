    <linearGradient id="salads-ochre" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecc074" />
      <stop offset="1" stop-color="#c48b45" />
    </linearGradient>
    <linearGradient id="salads-sage" x1="0" y1="0" x2="1" y2="1">
