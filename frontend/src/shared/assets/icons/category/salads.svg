<svg xmlns="http://www.w3.org/2000/svg" viewBox="11.16 6.76 72 72" fill="none">
  <defs>
    <linearGradient id="salads-ceramic" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0d3" />
