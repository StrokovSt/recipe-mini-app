<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Цвет строки состояния в установленном приложении, под тёмную тему меняется в shared/lib/theme -->
    <meta name="theme-color" content="#F0E7CC" />
    <meta name="apple-mobile-web-app-title" content="Mirabelle" />
    <title>Mirabelle</title>
    <script>
      // Тёмная тема до старта приложения, чтобы заставка не мигала светлой. Полная логика в shared/lib/theme
      if (localStorage.getItem("theme") === "dark") document.documentElement.setAttribute("data-theme", "dark");
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Заставка до старта приложения: React заменит её своим содержимым -->
      <p class="splash">Mirabelle</p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
