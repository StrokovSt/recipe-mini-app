<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Цвет строки состояния в установленном приложении, под тёмную тему меняется в shared/lib/theme -->
    <meta name="theme-color" content="#F0E7CC" />
    <meta name="apple-mobile-web-app-title" content="Kokoro" />
    <title>Kokoro</title>
    <meta name="description" content="Kokoro — личная коллекция рецептов: сохраняйте их по ссылке или фото, ИИ сам распознает ингредиенты и шаги." />
    <script>
      // Тёмная тема до старта приложения, чтобы заставка не мигала светлой. Полная логика в shared/lib/theme
      if (localStorage.getItem("theme") === "dark") document.documentElement.setAttribute("data-theme", "dark");
    </script>
    <style>
      /* Заставка с котиком: видна с первого кадра, ещё до скриптов и стилей приложения, поэтому стили здесь,
         а цвета и размеры числами: фон = --color-app-bg, котик = --size-loader-xl и стоит там же, где GlobalLoader.
         Убирает её shared/lib/splash, когда первая страница показана целиком */
      /* Фон только у body, не у html: тогда он уходит на весь холст и не перекрывает фоновую картинку (#root::before) */
      body,
      #splash {
        margin: 0;
        background: #f0e7cc;
      }

      [data-theme="dark"] body,
      [data-theme="dark"] #splash {
        background: #1d1814;
      }

      #splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.3s ease;
      }

      #splash.hidden {
        opacity: 0;
      }

      #splash video {
        width: 240px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Заставка: котик-загрузчик, пока приложение грузится целиком. Видео ставит и запускает shared/lib/splash
         (формат зависит от браузера), до того и пока оно качается, виден первый кадр -->
    <div id="splash">
      <video poster="/src/shared/assets/video/loaders/cat-poster.webp" muted loop playsinline preload="none"></video>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
